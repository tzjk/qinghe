server:
  port: 8090

spring:
  application:
    name: qinghe-life-service
  profiles:
    default: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/qinghe_life?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:1234}
  redis:
    host: ${REDIS_HOST:192.168.100.128}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:123321}
    database: 2
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        max-wait: 1000ms
        time-between-eviction-runs: 10s
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

qinghe:
  redis-key-prefix: "qh:"

order:
  payment-timeout-minutes: 15
  timeout:
    enabled: true
    cron: "0 * * * * ?"
    batch-size: 100
    lock-wait-seconds: 0
    lock-lease-seconds: 55

coupon:
  seckill:
    stream-key: qh:stream:coupon:claim
    consumer-group: coupon-seckill-group
    consumer-name: ${COUPON_SECKILL_CONSUMER:coupon-seckill-local}
    consume-enabled: true
    consume-delay-millis: 500
    consume-batch-size: 20
    pending-recovery-enabled: true
    pending-recovery-cron: "*/15 * * * * ?"
    pending-min-idle-seconds: 30
    pending-max-retries: 3
    pending-lock-wait-seconds: 0
    pending-lock-lease-seconds: 10

aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucket-name: java-ai1-kevin
    region: cn-beijing
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
